<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Steelman Solar</title>
<style>
  :root { color-scheme: dark;
    --bg:#0e1116; --panel:#151921; --line:#262c36;
    --txt:#e6e9ef; --dim:#8b93a1; --accent:#f5a524; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .card { width:min(380px,92vw); background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:28px 26px; }
  .sun { width:22px; height:22px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 16px rgba(245,165,36,.5); display:inline-block; vertical-align:middle; margin-right:10px; }
  h1 { font-size:16px; margin:0 0 6px; font-weight:600; }
  p { margin:0 0 22px; color:var(--dim); font-size:13px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--dim); margin:0 0 6px; font-weight:600; }
  input { width:100%; font:inherit; padding:10px 12px; border-radius:7px; margin-bottom:14px;
    border:1px solid var(--line); background:#0e1116; color:var(--txt); }
  input:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  button { width:100%; font:inherit; font-weight:600; padding:10px 15px; border-radius:7px;
    border:0; cursor:pointer; background:var(--accent); color:#1a1200; margin-top:4px; }
  button:disabled { opacity:.45; cursor:default; }
  .err { color:var(--bad); font-size:13px; margin:0 0 12px; min-height:1.2em; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1><span class="sun"></span>Steelman Solar</h1>
    <p>Sign in to open the call dashboard.</p>
    <div class="err" id="err"></div>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">Sign in</button>
  </form>
<script>
const err = document.getElementById("err");
const btn = document.getElementById("btn");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Login failed");
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>

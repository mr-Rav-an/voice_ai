<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steelman Solar — Voice Agent</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#171b22; --line:#262c36; --txt:#e6e9ef; --dim:#8b93a1; --accent:#f5a524; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  .sun { width:26px; height:26px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px rgba(245,165,36,.55); flex:none; }
  main { max-width:820px; margin:0 auto; padding:24px; }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:18px; }
  button { font:inherit; font-weight:600; padding:10px 20px; border-radius:8px; border:0; cursor:pointer; background:var(--accent); color:#1a1200; }
  button.stop { background:#3a3f4a; color:var(--txt); }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--dim); font-size:13px; }
  #log { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; height:52vh; overflow-y:auto; }
  .turn { margin-bottom:12px; }
  .who { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:2px; }
  .agent .who { color:var(--accent); }
  .tool { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#7fd1a8; background:#12251c; border-left:2px solid #7fd1a8; padding:6px 10px; border-radius:4px; white-space:pre-wrap; }
  .err { color:#ff8080; }
  .row { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--txt); }
</style>
</head>
<body>
<header><div class="sun"></div><h1>Steelman Solar — Rooftop Solar Sales Agent (Hindi / Hinglish)</h1></header>
<main>
  <div class="controls">
    <button id="start">Call shuru karein</button>
    <button id="stop" class="stop" disabled>Call end</button>
    <span id="status">Idle</span>
  </div>
  <div id="log"></div>
  <div class="row">
    <input id="text" placeholder="Bol nahi sakte? Yahan type kariye…" disabled />
    <button id="send" disabled>Send</button>
  </div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
